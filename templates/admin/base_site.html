{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} | NOVA Studio Admin{% endblock %}

{% block extrahead %}
    {{ block.super }}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/admin_custom.css' %}">
{% endblock %}

{% block branding %}
<div id="branding">
    <h1 id="site-name">
        <a href="{% url 'admin:index' %}">
            NOVA <span style="font-size: 13px; font-weight: 500; opacity: 0.7; letter-spacing: 0.05em; text-transform: uppercase; margin-left: 6px;">Studio Admin</span>
        </a>
    </h1>
</div>
{% endblock %}

{% block userlinks %}
    <a href="{% url 'home' %}" target="_blank" style="margin-right: 12px; color: #a5b4fc !important;">
        <i class="bi bi-box-arrow-up-right me-1"></i> View Live Store
    </a>
    {{ block.super }}
{% endblock %}
